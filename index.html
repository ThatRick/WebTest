<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WebTest Index</title>
  <style>
    html { color-scheme: dark; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #161616; color: #e5e5e5; padding: 2em 1em; }
    h1 { font-size: 1.25em; text-align: center; margin-bottom: 1.2em; }
    .list { display: flex; flex-direction: column; gap: .7em; max-width: 400px; margin: 0 auto; }
    a { padding: .9em 1em; border-radius: 8px; background: #222; color: #46c8fa; text-decoration: none; text-align: center; font-size: 1em; }
    a:active { background: #333; }
    .footer { text-align: center; margin-top: 2em; font-size: .85em; color: #888; }
  </style>
</head>
<body>
  <h1>WebTest Prototypes</h1>
  <div id="list" class="list">Loading…</div>
  <div class="footer">GitHub Pages</div>
  <script>
    fetch("https://api.github.com/repos/ThatRick/WebTest/contents/")
      .then(r=>r.json())
      .then(files => {
        document.getElementById("list").innerHTML = files
          .filter(f=>f.name.endsWith(".html"))
          .sort((a,b)=>a.name.localeCompare(b.name,'en',{sensitivity:'base'}))
          .map(f=>`<a href="https://thatrick.github.io/WebTest/${f.name}">${f.name.replace(".html","").replace(/_/g," ")}</a>`)
          .join("") || "<i>No HTML files found.</i>";
      })
      .catch(()=>{ document.getElementById("list").textContent="Failed to load files."; });
  </script>
</body>
</html>
