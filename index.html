<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HTML File Index</title>
  <style>
    body { font-family: sans-serif; padding: 2em; background: #111; color: #eee; }
    a { color: #4fc3f7; text-decoration: none; display: block; margin: 0.5em 0; }
  </style>
</head>
<body>
  <h1>Available Pages</h1>
  <div id="file-list">Loading...</div>

  <script>
    const repo = "ThatRick/WebTest";
    const branch = "main";
    const apiUrl = `https://api.github.com/repos/${repo}/contents/?ref=${branch}`;
    const baseUrl = `https://thatrick.github.io/WebTest/`;

    fetch(apiUrl)
      .then(res => res.json())
      .then(files => {
        const htmlFiles = files.filter(file => file.name.endsWith('.html'));
        const container = document.getElementById('file-list');
        container.innerHTML = '';

        htmlFiles.forEach(file => {
          const a = document.createElement('a');
          a.href = baseUrl + file.name;
          a.textContent = file.name;
          container.appendChild(a);
        });
      })
      .catch(err => {
        document.getElementById('file-list').textContent = 'Failed to load file list.';
        console.error(err);
      });
  </script>
</body>
</html>
